# be treated as verified counselling content until Aman signs off.

chunks:
  - id: overview
    title: What MBBS abroad involves
    tags: [overview, general, mbbs, abroad, study]
    text: >
      Many Indian students who have appeared for NEET pursue MBBS at recognised
      universities abroad. The degree is typically five to six years including
      internship. To practise in India afterwards, graduates clear the licensing
      exam (currently FMGE, moving to NExT). The right country and university
      depend on the student's NEET result, budget and preferences — our counsellor
      maps that out on a call.

  - id: eligibility-neet
    title: NEET eligibility for the abroad route
    tags: [eligibility, neet, cutoff, qualifying, score, marks]
    text: >
      To use the MBBS-abroad route an Indian student must have appeared for NEET
      and met the qualifying cutoff for that year. Below that cutoff, both
      government MBBS seats in India and the overseas route are closed for that
      cycle; private MBBS in India can still be an option for families who can
      fund it. We never tell a student they cannot become a doctor — but we are
      honest about which routes are open. The counsellor confirms the exact
      current cutoff and what it means for a specific score.

  - id: country-georgia
    title: MBBS in Georgia
    tags: [georgia, country, europe, university, cost, expensive]
    text: >
      Georgia is a popular destination — English-medium programmes, NMC-recognised
      government medical universities, a European setting and a straightforward
      admission process. Intakes are usually in autumn and spring. Georgia sits in
      a higher cost band than the CIS / Central Asian countries: it is a genuinely
      different education market with its own cost structure, so it is not
      comparable to the economical tier and should never be judged against those
      numbers. The counsellor shares the current figures for the universities that
      fit your profile and explains why the band is where it is.

  - id: country-russia
    title: MBBS in Russia
    tags: [russia, country, university, europe]
    text: >
      Russia has long hosted Indian medical students, with many NMC-recognised
      government (state) universities offering English-medium MBBS. Winters are
      cold and some universities have a preparatory year. Costs differ widely
      between universities — the counsellor walks through the options for your
      budget.

  - id: country-kazakhstan
    title: MBBS in Kazakhstan
    tags: [kazakhstan, country, university, central asia, budget]
    text: >
      Kazakhstan is often chosen by families looking for a more economical route,
      with NMC-recognised government medical universities and English-medium
      teaching. It borders India's region culturally and has a growing number of
      Indian students. The counsellor gives you the current fee and living-cost
      figures for specific universities.

  - id: country-uzbekistan
    title: MBBS in Uzbekistan
    tags: [uzbekistan, country, university, central asia, budget]
    text: >
      Uzbekistan has become a common choice in the more economical tier, with
      English-medium MBBS at recognised government medical universities and a
      relatively simple admission process. As with every country, exact costs
      depend on the university and package, which the counsellor covers on the
      call.

  - id: country-kyrgyzstan
    title: MBBS in Kyrgyzstan
    tags: [kyrgyzstan, country, university, central asia, budget]
    text: >
      Kyrgyzstan offers English-medium MBBS at NMC-recognised government medical
      universities and is generally in the more economical tier. The counsellor
      confirms current fees and the university shortlist for your profile.

  - id: country-bangladesh
    title: MBBS in Bangladesh
    tags: [bangladesh, country, university, saarc, budget]
    text: >
      Bangladesh is a well-established route for Indian students — English-medium
      MBBS at NMC-recognised government and government-affiliated medical colleges,
      a curriculum close to India's, a SAARC seat quota for Indian nationals, and
      no major language or food adjustment. Intakes and eligibility follow a fixed
      annual cycle. The counsellor confirms the current fees, the college
      shortlist for your NEET result and the admission timeline.

  - id: country-nepal
    title: MBBS in Nepal
    tags: [nepal, country, university, saarc, neighbour]
    text: >
      Nepal sits in a higher cost band than the CIS / Central Asian route, and
      there are concrete reasons families still choose it. It is right next to
      India, so travel is short and inexpensive and staying in touch with family
      is easy. The academic structure is almost identical to India's, and many of
      the faculty are Indian doctors, so the teaching style and expectations feel
      familiar. Universities are government-recognised and English-medium. Because
      the cost is higher, the counsellor always talks it through directly rather
      than leaving it as a number — and Rafique Sir is available on the phone for
      exactly this conversation.

  - id: country-premium
    title: Germany, the UK, the US and other premium destinations
    tags: [germany, uk, united kingdom, us, usa, united states, canada, australia, premium, cost]
    text: >
      Countries like Germany, the UK and the US have very different pathways,
      entrance requirements, timelines and costs — they vary a lot by country and
      by package, so it is not something to pin down over chat. Our counsellor
      talks you through what each route actually involves and gives you the exact
      numbers on a call.

  - id: recognition-licensing
    title: Recognition and practising in India
    tags: [nmc, mci, recognition, fmge, next, license, licensing, practise, india]
    text: >
      Study only at universities recognised by the National Medical Commission
      (NMC) if the plan is to return to India. Foreign medical graduates clear the
      licensing exam — currently the FMGE, transitioning to the NExT — to register
      and practise in India. The counsellor explains the full picture including
      what comes after MBBS.

  - id: nmc-criteria
    title: The NMC criteria a university must meet
    tags: [nmc, criteria, recognition, eligibility, fmge, next, university, rules]
    text: >
      For an MBBS-abroad degree to count toward Indian registration, the
      university must meet all of the NMC criteria: the medium of instruction is
      English; the course is a single combined structure of five years of study
      plus one year of internship (5+1); there is no mid-course transfer to
      another college; the university is listed with the WHO / World Directory of
      Medical Schools; it has its own or a permanently affiliated teaching
      hospital; and its graduates are eligible to practise medicine in that
      country. The counsellor checks every one of these for any university on your
      shortlist.

  - id: fmge-next
    title: FMGE / NExT licensing exam
    tags: [fmge, next, licensing, exam, attempts, pass, internship, practise, india]
    text: >
      To practise in India after MBBS abroad you clear the screening exam —
      currently the FMGE, moving to the NExT. The FMGE now allows three attempts
      per year (it used to be two), with a pass mark of 50% on a 300-mark paper,
      followed by a one-year paid internship in India. How students do on it
      depends heavily on which university they did MBBS at, which is exactly why
      choosing the right university upfront matters.

  - id: india-vs-abroad
    title: MBBS in India vs MBBS abroad
    tags: [india, abroad, comparison, cost, private, government, value, fmge]
    text: >
      For a student who qualified NEET but is short of a government MBBS seat,
      private MBBS in India costs several times more than the economical-tier
      abroad route (Kazakhstan / Uzbekistan). A recognised university abroad plus
      the FMGE / NExT route is often far more affordable than a private Indian
      college. Exact figures depend on the specific colleges and universities in
      play — the counsellor runs the real numbers for your case.

  - id: admission-process
    title: How admission works
    tags: [admission, process, documents, application, timeline, intake]
    text: >
      Admission usually needs NEET result, Class 10 and 12 marksheets, passport
      and a few university forms. For a UG MBBS student applying to study abroad
      the process — documents, offer letter, nominal fee, conditional admission
      and invitation, passport, visa, ticket, travel — usually takes around 28
      days end to end, though it depends on the intake. We do not guarantee
      admission, a specific university or a specific intake — the counsellor
      assesses your profile and tells you what is realistic.

  - id: why-call
    title: What the counsellor covers on the call
    tags: [call, counsellor, booking, meeting, next step, help]
    text: >
      A short call with our counsellor covers the country and university shortlist
      for your NEET result, current costs and packages, the admission timeline,
      recognition and licensing, and the practical side — safety, food, language.
      It is the fastest way to get accurate answers for your situation. Calls are
      about 15 minutes; an in-person meeting at our office is also an option.

  - id: faq-safety-food
    title: Safety, food and language
    tags: [safety, food, indian food, language, hostel, living, faq, parents]
    text: >
      Universities that host Indian students usually have Indian food available,
      Indian student communities and hostel accommodation. Teaching in the
      countries we work with is in English. Safety varies by city and university —
      the counsellor gives you a candid view for each option.

  - id: government-institutes
    title: We place students only in government medical institutes
    tags: [legitimate, legitimacy, government, private, recognition, trust, genuine, safe, fake]
    text: >
      Across every country we work with, we place students only in government or
      government-led medical institutes — not private colleges. This is a
      deliberate policy and one of the main reasons families work with us. A
      government medical university is state-run and state-accountable, which is
      the clearest answer to "how do I know this university is real and will still
      be recognised in a few years". The counsellor confirms the exact recognition
      status (NMC listing, WHO directory) for any specific university on your
      shortlist.

  - id: about-stellar
    title: About Stellar Educonsultancy
    tags: [about, who, company, stellar, experience, history, trust, years]
    text: >
      Stellar Educonsultancy guides NEET students and their families through the
      MBBS-abroad process end to end. The team has over ten years of hands-on
      experience placing students abroad, and the practice was formally registered
      as Stellar Educonsultancy in 2024 — both are true and belong together: an
      established team operating under a current registered name. The office is in
      Mira Road East, Thane, and the director is Rafique Shaikh, whom leads deal
      with directly. We do not make admission or university guarantees; the
      counsellor assesses each profile honestly.
