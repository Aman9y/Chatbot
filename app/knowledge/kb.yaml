# MBBS Abroad Lead Bot — knowledge base (Phase 3 seed).
#
# PRE-REDACTED per plan §2: no premium-country (Germany/UK/US) cost figures, no
# PG cost figure, no financing/loan specifics. The ingestion lint in
# app/services/knowledge/yaml_kb.py re-checks every chunk on load and refuses any
# that contains a blocked figure — redaction is enforced, not trusted.
#
