[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbbs-lead-bot"
version = "0.1.0"
description = "MBBS Abroad Lead Bot — Phase 2 (ingestion pipe: webhook, persistence, state machine, outreach guard)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "phonenumbers>=8.13",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "anthropic>=1.4",
    "openai>=1.40",
    "google-genai>=1.0",
    "celery[redis]>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "fakeredis>=2.23",
    "ruff>=0.5",
]

[project.scripts]
leadbot = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# tests build long inline webhook payloads; wrapping them hurts readability
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501"]
