x-app-env: &app-env
  APP_ENV: docker
  DATABASE_URL: postgresql+asyncpg://chatbot:chatbot@db:5432/chatbot
  REDIS_URL: redis://redis:6379/0
  WHATSAPP_CLIENT: ${WHATSAPP_CLIENT:-fake}
  META_APP_SECRET: ${META_APP_SECRET:-dev-app-secret-change-me}
  META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-dev-verify-token}
  META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
  META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OUTREACH_REQUIRE_VERIFIED_CONSENT: ${OUTREACH_REQUIRE_VERIFIED_CONSENT:-true}
  MINOR_DEFAULT_POLICY: ${MINOR_DEFAULT_POLICY:-pending_review}
  SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
  NEET_YEAR: ${NEET_YEAR:-2026}
  NEET_CUTOFF_GENERAL: ${NEET_CUTOFF_GENERAL:-213}
  NEET_CUTOFF_OBC: ${NEET_CUTOFF_OBC:-175}
  STATEABLE_COST_COUNTRIES: ${STATEABLE_COST_COUNTRIES:-Kazakhstan,Uzbekistan}
  STATEABLE_COST_RANGE: ${STATEABLE_COST_RANGE:-₹30–35 lakh}
  INDIA_COMPARE_COST_RANGE: ${INDIA_COMPARE_COST_RANGE:-₹80L–1.2Cr}
  WEBHOOK_CONVERSATION_DISPATCH: ${WEBHOOK_CONVERSATION_DISPATCH:-celery}
  CONSENT_GATE_ENABLED: ${CONSENT_GATE_ENABLED:-true}
  CONSENT_ASK_SWEEP_ENABLED: ${CONSENT_ASK_SWEEP_ENABLED:-false}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    # Host port 5433 to avoid clashing with a native Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Host port 6380 to avoid clashing with a native Redis on 6379.
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env
    ports:
      - "8000:8000"

  worker:
    build: .
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env
    # migrations are applied by `app`; the worker just runs the Celery worker
    entrypoint: []
    command: ["celery", "-A", "app.scheduler.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

  beat:
    build: .
    depends_on:
      worker:
        condition: service_started
    environment: *app-env
    entrypoint: []
    command: ["celery", "-A", "app.scheduler.celery_app", "beat", "--loglevel=info"]

volumes:
  pgdata:
  redisdata:
